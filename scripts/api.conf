# Per-repo settings for scripts/api.sh and scripts/cheatsheet.sh (POSIX sh).
# Everything else in those two scripts is identical in every binding.
REPO=odin-gtk3
PACKAGES="atk gtk3"
COLLECTION=gtk3
DOC_COLLECTIONS="-collection:gtk3=. -collection:glib=${AMBER_ROOT:-..}/odin-glib -collection:cairo=${AMBER_ROOT:-..}/odin-cairo -collection:pango=${AMBER_ROOT:-..}/odin-pango -collection:pixbuf=${AMBER_ROOT:-..}/odin-gdk-pixbuf"
INTRO='The short form is the [cheat sheet](CHEATSHEET.md); the rules of the bindings are in the
[README](../README.md) and [PATCHED.md](PATCHED.md).'
ALIASES="gtk3=gtk3 atk=atk"
DEDUP=1
