    - "../build/sys/usr/include/gdk-pixbuf-2.0/gdk-pixbuf/*"
    - "../build/sys/usr/include/atk-1.0/atk/*"
  ignore:
    types:
      - '*autoptr*'
      - va_list
    constants:
      - 'GTK_DEPRECATED*'
      - 'GDK_DEPRECATED*'
      - 'GTK_AVAILABLE*'
      - 'GDK_AVAILABLE*'
      - 'GDK_VERSION_M*'
      - 'GTK_VERSION_M*'
      - '_GTK*'
      - '_GDK*'
      - 'GMODULE*'
