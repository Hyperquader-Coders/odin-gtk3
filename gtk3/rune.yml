    # structs on x86_64 (docs/PATCHED.md). Use the accessor procedures.
    types:
      _GtkRcStyle: '#UInt64 #Attr Arr 48 #AttrEnd'
      _GtkContainerClass: '#UInt64 #Attr Arr 122 #AttrEnd'
      _GtkMenuShellClass: '#UInt64 #Attr Arr 136 #AttrEnd'
      _GtkMenuItemClass: '#UInt64 #Attr Arr 139 #AttrEnd'
      _GtkTableChild: '#UInt64 #Attr Arr 3 #AttrEnd'
      _GtkTableRowCol: '#UInt32 #Attr Arr 2 #AttrEnd'
      # Placeholders, replaced by the hand-written declarations in hand.odin.
      _GdkEventKey: '#UInt8 #Attr Arr 1 #AttrEnd'
      _GdkEventScroll: '#UInt8 #Attr Arr 1 #AttrEnd'
      _GtkTextAppearance: '#UInt8 #Attr Arr 1 #AttrEnd'
      _GtkTextAttributes: '#UInt8 #Attr Arr 1 #AttrEnd'
      _GtkBindingSet: '#UInt8 #Attr Arr 1 #AttrEnd'
      _GtkBindingEntry: '#UInt8 #Attr Arr 1 #AttrEnd'
